# Tool System Module Configuration
spring:
  application:
    name: tool-system-demo

  # AgentScope DashScope Configuration
  ai:
    dashscope:
      base-url: ${AI_DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/api/v1}
      api-key: ${AI_DASHSCOPE_API_KEY:your-api-key}
      chat:
        options:
          model: ${AI_DASHSCOPE_MODEL_NAME:qwen-max}

